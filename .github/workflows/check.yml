# Runs the tests and builds both apps for every push to main and every pull request.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Only what the build needs: the action's default list asks for "tools", which Google removed.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test
      - name: Build both versions
        run: |
          ./gradlew :desktop:compileKotlin :android:assembleStandardDebug :android:assembleFullDebug
          ./gradlew -Pedition=standard :desktop:compileKotlin
