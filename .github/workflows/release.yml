# Builds and publishes a release when a version tag is pushed (v0.21.0 for forage.version=0.21.0):
# the tests, then both versions (Standard and Full) as Linux packages and signed Android APKs,
# attached to a GitHub release whose notes come from docs/releases/<version>.md.
#
# Needs two repository secrets (Settings, Secrets and variables, Actions):
#   FORAGE_KEYSTORE_BASE64   the signing key, base64-encoded (base64 -w0 forage-release.jks)
#   FORAGE_KEYSTORE_PASSWORD its password
# Without them the release stops: an APK signed with another key couldn't update installed ones.
# Packaging the second Linux package needs dpkg-deb, which the runner has.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version
        run: |
          version=$(grep '^forage.version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match forage.version=$version in gradle.properties"
            exit 1
          fi
          if [ ! -f "docs/releases/$version.md" ]; then
            echo "::error::No release notes: docs/releases/$version.md"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORAGE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORAGE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The signing key secrets (FORAGE_KEYSTORE_BASE64, FORAGE_KEYSTORE_PASSWORD) aren't set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/forage-release.jks"
          echo "FORAGE_KEYSTORE=$RUNNER_TEMP/forage-release.jks" >> "$GITHUB_ENV"
          echo "FORAGE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Only what the build needs: the action's default list asks for "tools", which Google removed.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Test
        run: ./gradlew test

      # Both versions: Standard (without the private vault's site) and Full.
      - name: Build the Linux packages and the Android apps
        run: |
          ./gradlew :desktop:packageReleaseDebFile :android:assembleStandardRelease :android:assembleFullRelease
          ./gradlew -Pedition=standard :desktop:packageReleaseDebFile

      - name: Collect the files
        run: |
          mkdir out
          cp "desktop/build/release/forage_${VERSION}_amd64.deb" out/
          cp "desktop/build/release/forage-full_${VERSION}_amd64.deb" out/
          cp android/build/outputs/apk/standard/release/android-standard-release.apk "out/forage-${VERSION}.apk"
          cp android/build/outputs/apk/full/release/android-full-release.apk "out/forage-full-${VERSION}.apk"
          # The APKs must carry Forage's own signature, never the debug key's.
          for apk in out/*.apk; do
            "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"/apksigner verify --print-certs "$apk" | tee signature.txt
            if grep -q "CN=Android Debug" signature.txt; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done
          (cd out && sha256sum * > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          name: Forage ${{ env.VERSION }}
          body_path: docs/releases/${{ env.VERSION }}.md
          files: out/*

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/forage-release.jks"
