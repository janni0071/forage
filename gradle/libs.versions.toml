[versions]
kotlin = "2.2.20"
serialization = "1.9.0"
newpipe-extractor = "v0.27.1"
sqldelight = "2.4.1"
compose = "1.12.2"
agp = "8.13.2"

[libraries]
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipe-extractor" }
jsoup = { module = "org.jsoup:jsoup", version = "1.24.1" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version = "1.32.0" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers", version = "0.40.0" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.0.17" }
lingua = { module = "com.github.pemistahl:lingua", version = "1.2.2" }
compose-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
# The same version SQLDelight brings in; used directly for loading and saving in-memory databases.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.53.4.0" }
# Android: the same Compose libraries the desktop uses, in their Android builds.
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version = "1.9.0" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version = "1.32.0" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.12.4" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
