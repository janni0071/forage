# Forage's version, one for the desktop and Android apps: a release is tagged v<this>.
forage.version=0.21.0

kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true

# Android: the AndroidX libraries Compose and SQLDelight use.
android.useAndroidX=true
# Android builds (dexing, resource merging) need more than the default heap.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
